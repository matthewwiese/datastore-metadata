---
name: Notify LIS-autocontent
on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger populate-catalog
        env:
          # Fine-grained PAT with "Actions: read and write" on
          # matthewwiese/LIS-autocontent, stored as a secret in this repo.
          GH_TOKEN: ${{ secrets.LIS_AUTOCONTENT_DISPATCH_TOKEN }}
        run: |
          gh workflow run populate-catalog.yml \
            --repo matthewwiese/LIS-autocontent
